<!DOCTYPE html>
<html>
<head>
  <title>For Debuuu 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg,#ff9a9e,#fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      max-width: 350px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
      animation: pop 1s ease;
    }
    h1 { color:#ff4d6d; }
    p { font-size:18px; }
    button {
      margin-top:20px;
      padding:12px 25px;
      border:none;
      border-radius:30px;
      background:#ff4d6d;
      color:white;
      font-size:16px;
    }
    .heart {
      position:absolute;
      font-size:22px;
      animation: float 4s linear;
    }
    @keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
    @keyframes float {
      from{transform:translateY(0);opacity:1}
      to{transform:translateY(-700px);opacity:0}
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hey Debuuu 💖</h1>
    <p>
      You make my days special just by being you.<br><br>
      Will you be my Valentine? 🌹✨
    </p>
    <button onclick="alert('Yayyy 💕')">Yes 💘</button>
  </div>

  <script>
    setInterval(()=>{
      const h=document.createElement("div");
      h.className="heart";
      h.innerText="💖";
      h.style.left=Math.random()*100+"vw";
      h.style.bottom="0";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),4000);
    },400);
  </script>
</body>
</html>
